name: Companion Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: companion-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate links, prompts, licenses, versions, and public boundary
        run: python3 scripts/check_companion.py

  examples:
    name: Runnable examples
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  reader-documents:
    name: Tagged reader documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-liberation
          python3 -m pip install -r release-assets/requirements-reader-guide.txt
      - name: Rebuild semantic DOCX and tagged PDFs
        run: |
          python3 scripts/build_reader_guide.py
          python3 scripts/build_teaching_panels.py
      - name: Reject untagged or version-mismatched outputs
        run: python3 scripts/check_companion.py
